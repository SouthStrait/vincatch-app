<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VINcatch - Vehicle Profile Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Lobster&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Poppins', 'sans-serif'],
              cursive: ['Lobster', 'cursive'],
            },
            colors: {
              gray: {
                950: '#121019', // Near black with purple tint for bg
                900: '#1C1924', // Darker surfaces
                800: '#262330', // Borders, subtle surfaces
                700: '#3A374A', // Interactive elements
                600: '#48445A', // Hover interactive elements
                500: '#717180', // Disabled text
              },
              neutral: {
                100: '#f5f5f5', // Brightest text
                200: '#e5e5e5', // Main text
                300: '#d4d4d4',
                400: '#a3a3a3', // Subdued text
                500: '#737373',
              },
              orange: {
                300: '#fdba74',
                400: '#fb923c',
                500: '#f97316',
                600: '#ea580c',
                700: '#c2410c',
              },
              green: {
                300: '#a7f3d0',
                400: '#6ee7b7',
                500: '#34d399',
                600: '#10b981',
                700: '#059669',
              }
            },
            keyframes: {
              'fade-in': {
                '0%': { opacity: '0', transform: 'translateY(10px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
            },
            animation: {
              'fade-in': 'fade-in 0.5s ease-out forwards',
            },
          },
        },
      }
    </script>
  <script type="importmap">
{
  "imports": {
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.27.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body class="bg-gray-950 text-neutral-200">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
